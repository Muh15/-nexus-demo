name: NEXUS MVP Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r mvp/requirements.txt
      - name: Compile
        run: python -m py_compile mvp/main.py mvp/test_smoke.py
      - name: Smoke tests
        working-directory: mvp
        run: python -m pytest -q test_smoke.py
